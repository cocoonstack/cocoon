name: build-os-images

on:
  push:
    branches: [master]
    paths:
      - "os-image/**"
      - "!os-image/windows/**"
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Force rebuild without cache"
        type: boolean
        default: false
      only:
        description: "Restrict to one os-image dir <family>/<tag>, e.g. ubuntu/22.04-redroid-16.0-gms-h264; empty = all"
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed Dockerfiles
        id: set-matrix
        run: |
          # Determine if manual no-cache was requested
          MANUAL_NO_CACHE="${{ github.event.inputs.no-cache }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # On manual trigger, build everything
            declare -A names
            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              [[ -f "$(dirname "$dockerfile")/.skip-generic-build" ]] && continue
              name=$(echo "$dockerfile" | cut -d'/' -f2)
              names[$name]=1
            done <<< "$(find os-image -name Dockerfile -type f)"
            # Use all changed files (empty for dispatch = treat all as changed)
            all_changed=""
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              declare -A names
              while IFS= read -r dockerfile; do
                [[ -z "$dockerfile" ]] && continue
                [[ -f "$(dirname "$dockerfile")/.skip-generic-build" ]] && continue
                name=$(echo "$dockerfile" | cut -d'/' -f2)
                names[$name]=1
              done <<< "$(find os-image -name Dockerfile -type f)"
              all_changed=""
            else
              all_changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'os-image/' | sort -u)
              declare -A names
              for f in $all_changed; do
                tag_dir=$(echo "$f" | cut -d'/' -f1-3)
                [[ -f "$tag_dir/.skip-generic-build" ]] && continue
                name=$(echo "$f" | cut -d'/' -f2)
                if [[ -n "$name" ]]; then
                  names[$name]=1
                fi
              done
            fi
          fi

          # Build matrix with per-entry no-cache flag
          matrix_entries=()
          for name in "${!names[@]}"; do
            # Check if any non-Dockerfile file changed under os-image/{name}/
            # i.e. shared files like scripts that affect all tags
            needs_no_cache="false"
            if [[ "$MANUAL_NO_CACHE" == "true" ]]; then
              needs_no_cache="true"
            elif [[ -n "$all_changed" ]]; then
              # Files directly under os-image/{name}/ (not in tag subdirs) changed
              while IFS= read -r f; do
                [[ -z "$f" ]] && continue
                # Count path components: os-image/{name}/{file} = 3 parts (not in a tag subdir)
                depth=$(echo "$f" | awk -F'/' '{print NF}')
                if [[ "$depth" -eq 3 ]]; then
                  needs_no_cache="true"
                  break
                fi
              done <<< "$(echo "$all_changed" | grep "^os-image/$name/")"
            fi

            # Detect platform support (default: multi-arch)
            platforms="linux/amd64,linux/arm64"
            if [[ -f "os-image/$name/platforms" ]]; then
              platforms=$(cat "os-image/$name/platforms")
            fi

            # Find all Dockerfiles for this name
            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              [[ -f "$(dirname "$dockerfile")/.skip-generic-build" ]] && continue
              tag=$(echo "$dockerfile" | cut -d'/' -f3)
              if [[ -n "$tag" ]]; then
                matrix_entries+=("{\"name\":\"$name\",\"tag\":\"$tag\",\"no_cache\":\"$needs_no_cache\",\"platforms\":\"$platforms\"}")
              fi
            done <<< "$(find "os-image/$name" -name Dockerfile -type f)"
          done

          # Optional workflow_dispatch scoping: build only one <family>/<tag>.
          ONLY="${{ github.event.inputs.only }}"
          if [[ -n "$ONLY" ]]; then
            want_name="${ONLY%%/*}"; want_tag="${ONLY#*/}"
            filtered=()
            for e in "${matrix_entries[@]}"; do
              [[ "$e" == *"\"name\":\"$want_name\""* && "$e" == *"\"tag\":\"$want_tag\""* ]] && filtered+=("$e")
            done
            matrix_entries=("${filtered[@]}")
          fi

          if [[ ${#matrix_entries[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            json=$(IFS=,; echo "${matrix_entries[*]}")
            echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
          fi

          echo "Generated matrix: $(cat "$GITHUB_OUTPUT")"

  build:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image may repoint its published name/tag via a `publish-as` file
      # (`<name>:<tag>`); without one it publishes as its own family/tag.
      - name: Resolve publish target
        id: publish
        run: |
          name="${{ matrix.name }}"
          tag="${{ matrix.tag }}"
          f="os-image/${{ matrix.name }}/${{ matrix.tag }}/publish-as"
          if [[ -f "$f" ]]; then
            spec="$(tr -d '[:space:]' < "$f")"
            name="${spec%%:*}"
            tag="${spec#*:}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ steps.publish.outputs.name }}
          # Canonical tag only from master; the always-on sha tag gives a pullable
          # ref for pre-merge dispatch builds without clobbering the release tag.
          tags: |
            type=raw,value=${{ steps.publish.outputs.tag }},enable=${{ github.ref_name == 'master' }}
            type=sha,prefix=${{ steps.publish.outputs.tag }}-

      - name: Discover secret files
        id: secrets
        run: |
          base="os-image/${{ matrix.name }}"
          tag="${{ matrix.tag }}"
          {
            echo "files<<EOF"
            # Shared secrets (base dir)
            for f in "$base"/*.sh "$base"/*.rc; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              case "$name" in
                overlay.sh)  id="cocoon_overlay" ;;
                network.sh)  id="cocoon_network" ;;
                *.rc)        id="cocoon_$(echo "${name%.rc}" | tr '-' '_')_rc" ;;
                *.sh)        id="cocoon_$(echo "${name%.sh}" | tr '-' '_')" ;;
              esac
              echo "${id}=${f}"
            done
            # Tag-specific secrets (tag subdir, skip Dockerfile)
            for f in "$base/$tag"/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              [ "$name" = "Dockerfile" ] && continue
              id="$(echo "$name" | tr '.-' '__')"
              echo "${id}=${f}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Optional per-image build-artifact hook: runs only for tag dirs that ship a
      # ci-prepare.sh (currently only the ReDroid GMS image, which needs a
      # privileged DinD bake to produce docker-data-<arch>.tar). No-op for every
      # other image. Runs AFTER secret discovery so its multi-GB tars are not
      # globbed as secrets, and after QEMU/Buildx so the arm64 bake can emulate.
      - name: Free disk space
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Cache raw Google system images
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        uses: actions/cache@v6
        with:
          path: os-image/${{ matrix.name }}/${{ matrix.tag }}/.cache-gapps16
          key: gapps16-sysimg-${{ hashFiles(format('os-image/{0}/{1}/prepare-gapps16.sh', matrix.name, matrix.tag)) }}

      - name: Run CI prepare hook
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        run: bash "os-image/${{ matrix.name }}/${{ matrix.tag }}/ci-prepare.sh"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: os-image/${{ matrix.name }}
          file: os-image/${{ matrix.name }}/${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: ${{ steps.secrets.outputs.files }}
          no-cache: ${{ matrix.no_cache == 'true' }}
          cache-from: ${{ matrix.no_cache == 'true' && '' || format('type=gha,scope={0}-{1}', matrix.name, matrix.tag) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}
