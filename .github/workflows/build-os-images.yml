name: build-os-images

on:
  push:
    branches: [master]
    paths:
      - "os-image/**"
      - "!os-image/**/*.md"
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Force rebuild without cache"
        type: boolean
        default: false
      only:
        description: "Restrict to one os-image dir <family>/<tag>, e.g. ubuntu/22.04-redroid-16.0-gms-h264; empty = all"
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Find changed Dockerfiles
        id: set-matrix
        run: |
          MANUAL_NO_CACHE="${{ github.event.inputs.no-cache }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            declare -A names
            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              name=$(echo "$dockerfile" | cut -d'/' -f2)
              names[$name]=1
            done <<< "$(find os-image -name Dockerfile -type f)"
            all_changed=""
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              declare -A names
              while IFS= read -r dockerfile; do
                [[ -z "$dockerfile" ]] && continue
                name=$(echo "$dockerfile" | cut -d'/' -f2)
                names[$name]=1
              done <<< "$(find os-image -name Dockerfile -type f)"
              all_changed=""
            else
              all_changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'os-image/' ':!*.md' | sort -u)
              declare -A names
              for f in $all_changed; do
                name=$(echo "$f" | cut -d'/' -f2)
                if [[ -n "$name" ]]; then
                  names[$name]=1
                fi
              done
            fi
          fi

          matrix_entries=()
          for name in "${!names[@]}"; do
            needs_no_cache="false"
            if [[ "$MANUAL_NO_CACHE" == "true" ]]; then
              needs_no_cache="true"
            elif [[ -n "$all_changed" ]]; then
              while IFS= read -r f; do
                [[ -z "$f" ]] && continue
                # Count path components: os-image/{name}/{file} = 3 parts (not in a tag subdir)
                depth=$(echo "$f" | awk -F'/' '{print NF}')
                if [[ "$depth" -eq 3 ]]; then
                  needs_no_cache="true"
                  break
                fi
              done <<< "$(echo "$all_changed" | grep "^os-image/$name/")"
            fi

            platforms="linux/amd64,linux/arm64"
            if [[ -f "os-image/$name/platforms" ]]; then
              platforms=$(cat "os-image/$name/platforms")
            fi

            while IFS= read -r dockerfile; do
              [[ -z "$dockerfile" ]] && continue
              tag=$(echo "$dockerfile" | cut -d'/' -f3)
              [[ -n "$tag" ]] || continue
              tag_no_cache="$needs_no_cache"
              if [[ "$tag_no_cache" == "false" ]] && grep -v '/Dockerfile$' <<< "$all_changed" | grep -q "^os-image/$name/$tag/"; then
                tag_no_cache="true"
              fi
              matrix_entries+=("{\"name\":\"$name\",\"tag\":\"$tag\",\"no_cache\":\"$tag_no_cache\",\"platforms\":\"$platforms\"}")
            done <<< "$(find "os-image/$name" -name Dockerfile -type f)"
          done

          ONLY="${{ github.event.inputs.only }}"
          if [[ -n "$ONLY" ]]; then
            want_name="${ONLY%%/*}"; want_tag="${ONLY#*/}"
            filtered=()
            for e in "${matrix_entries[@]}"; do
              [[ "$e" == *"\"name\":\"$want_name\""* && "$e" == *"\"tag\":\"$want_tag\""* ]] && filtered+=("$e")
            done
            matrix_entries=("${filtered[@]}")
          fi

          if [[ ${#matrix_entries[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            json=$(IFS=,; echo "${matrix_entries[*]}")
            echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
          fi

          echo "Generated matrix: $(cat "$GITHUB_OUTPUT")"

  build:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A publish-as file (<name>:<tag>) overrides the published name and tag.
      - name: Resolve publish target
        id: publish
        run: |
          name="${{ matrix.name }}"
          tag="${{ matrix.tag }}"
          f="os-image/${{ matrix.name }}/${{ matrix.tag }}/publish-as"
          if [[ -f "$f" ]]; then
            spec="$(tr -d '[:space:]' < "$f")"
            name="${spec%%:*}"
            tag="${spec#*:}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ steps.publish.outputs.name }}
          # Canonical tag only from master; the sha tag keeps pre-merge builds pullable.
          tags: |
            type=raw,value=${{ steps.publish.outputs.tag }},enable=${{ github.ref_name == 'master' }}
            type=sha,prefix=${{ steps.publish.outputs.tag }}-

      - name: Discover secret files
        id: secrets
        run: |
          base="os-image/${{ matrix.name }}"
          tag="${{ matrix.tag }}"
          {
            echo "files<<EOF"
            for f in "$base"/*.sh "$base"/*.rc; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              case "$name" in
                overlay.sh)  id="cocoon_overlay" ;;
                network.sh)  id="cocoon_network" ;;
                *.rc)        id="cocoon_$(echo "${name%.rc}" | tr '-' '_')_rc" ;;
                *.sh)        id="cocoon_$(echo "${name%.sh}" | tr '-' '_')" ;;
              esac
              echo "${id}=${f}"
            done
            for f in "$base/$tag"/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              [ "$name" = "Dockerfile" ] && continue
              id="$(echo "$name" | tr '.-' '__')"
              echo "${id}=${f}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Runs only where ci-prepare.sh exists; after secret discovery so its tars are not globbed as secrets.
      - name: Free disk space
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Cache raw Google system images
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        uses: actions/cache@v6.1.0
        with:
          path: os-image/${{ matrix.name }}/${{ matrix.tag }}/.cache-gapps16
          key: gapps16-sysimg-${{ hashFiles(format('os-image/{0}/{1}/prepare-gapps16.sh', matrix.name, matrix.tag)) }}

      - name: Run CI prepare hook
        if: ${{ hashFiles(format('os-image/{0}/{1}/ci-prepare.sh', matrix.name, matrix.tag)) != '' }}
        run: bash "os-image/${{ matrix.name }}/${{ matrix.tag }}/ci-prepare.sh"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: os-image/${{ matrix.name }}
          file: os-image/${{ matrix.name }}/${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: ${{ steps.secrets.outputs.files }}
          no-cache: ${{ matrix.no_cache == 'true' }}
          cache-from: ${{ matrix.no_cache == 'true' && '' || format('type=gha,scope={0}-{1}', matrix.name, matrix.tag) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}
