name: build-redroid-16-gms

# Dedicated workflow for os-image/ubuntu/22.04-redroid-16.0-gms-h264: a privileged
# DinD bakes a restart-primed ReDroid container into the VM image. The one-shot
# bake wrapper does not boot Android on the runner, so runner binder/ashmem are
# not required. This is not part of build-os-images.yml because the generic
# matrix cannot produce docker-data.tar. Feature-branch pushes publish immutable
# dev-SHA tags; master/manual releases publish the requested canonical tag.
on:
  push:
    branches: [master, feat/os-image-redroid-16.0-gms-h264]
    paths:
      - 'os-image/ubuntu/22.04-redroid-16.0-gms-h264/**'
      - '.github/workflows/build-redroid-16-gms.yml'
  workflow_dispatch:
    inputs:
      push:
        description: "push per-arch images + a multi-arch manifest to ghcr"
        type: boolean
        default: false
      gms:
        description: "true = real GApps image (needs prepare-gapps16.sh); false = plain redroid 16 (pipeline probe)"
        type: boolean
        default: true
      vm_tag:
        description: "base VM image tag"
        default: "16.0-gms-h264"

env:
  REGISTRY_NS: ghcr.io/cocoonstack/cocoon
  # Aligned with the other Android/redroid images (android:14.0 / 15.0 / 15.0-gms);
  # gms + h264 live in the tag.
  IMAGE: ghcr.io/cocoonstack/cocoon/android
  IMAGE_DIR: os-image/ubuntu/22.04-redroid-16.0-gms-h264
  REDROID_DIGEST: sha256:7b1e389bd15f37af3bcd06138f5b2ffa7cfba4332bd5ef54c53e99c2f160a15b
  BUSYBOX_DIGEST: sha256:222ad6d973c0d198014546a65cd02c5fdedcc172123c5b4c2bf0af636550bd94
  PUBLISH_TAG: ${{ (github.event_name == 'push' && github.ref_name != 'master' && format('dev-{0}', github.sha)) || inputs.vm_tag || '16.0-gms-h264' }}

jobs:
  bake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04, abi: x86_64 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm, abi: arm64-v8a }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ inputs.push }}" = "true" ] && [ "${{ inputs.gms }}" != "true" ]; then
            echo "::error::Refusing to publish a non-GMS probe under a GMS image tag" >&2
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Host build deps
        run: |
          sudo apt-get install -y curl ca-certificates unzip gzip \
            erofs-utils android-sdk-libsparse-utils e2fsprogs

      # ---- GApps overlay (real image only). prepare-gapps16.sh downloads the Google
      #      API-36 Play Store system image, verifies it, extracts system.img, and
      #      emits gapps16-<arch>.tar. ----
      - name: Cache raw Google system image
        if: ${{ github.event_name == 'push' || inputs.gms }}
        uses: actions/cache@v4
        with:
          path: ${{ env.IMAGE_DIR }}/.cache-gapps16
          key: gapps16-sysimg-${{ matrix.arch }}-api36-r07
      - name: Prepare gapps tar
        if: ${{ github.event_name == 'push' || inputs.gms }}
        run: |
          set -euo pipefail
          cd "${IMAGE_DIR}"
          ARCH=${{ matrix.arch }} bash prepare-gapps16.sh
          test -f "gapps16-${{ matrix.abi }}.tar"

      - name: Login to ghcr
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- ReDroid source image (local/redroid-gms:16.0-cocoon), single layer ----
      - name: Build ReDroid source image
        run: |
          set -euo pipefail
          cd "${IMAGE_DIR}"
          if [ "${{ github.event_name == 'push' || inputs.gms }}" = "true" ]; then
            docker buildx build --load --platform linux/${{ matrix.arch }} \
              --build-arg TARGETARCH=${{ matrix.arch }} \
              --build-arg GAPPS_TAR=gapps16-${{ matrix.abi }}.tar \
              -f redroid-gms16.Dockerfile -t local/redroid-gms:16.0-cocoon .
          else
            printf 'FROM redroid/redroid:16.0.0_64only-latest@%s AS b\nFROM busybox:1.37.0-musl@%s AS t\nFROM scratch\nCOPY --from=b / /\nCOPY --from=t /bin/busybox /busybox\nCOPY cocoon-bake-init.sh /cocoon-bake-init\nCOPY cocoon-bake-once /.cocoon-bake-once\nWORKDIR /\nENTRYPOINT ["/busybox", "sh", "/cocoon-bake-init", "qemu=1", "androidboot.hardware=redroid"]\n' \
              "${REDROID_DIGEST}" "${BUSYBOX_DIGEST}" > /tmp/flat.Dockerfile
            docker buildx build --load --platform linux/${{ matrix.arch }} \
              -f /tmp/flat.Dockerfile -t local/redroid-gms:16.0-cocoon .
          fi
          test "$(docker image inspect --format '{{len .RootFS.Layers}}' local/redroid-gms:16.0-cocoon)" = 1

      # ---- Privileged DinD restart-policy bake + VM image build (+ push) ----
      - name: Bake VM image
        env:
          ARCH: ${{ matrix.arch }}
          REDROID_SRC: local/redroid-gms:16.0-cocoon
          USE_MEMFD: "0"
          REGISTRY: ${{ env.REGISTRY_NS }}
          VM_TAG: android:${{ env.PUBLISH_TAG }}-${{ matrix.arch }}
          PUSH: ${{ (github.event_name == 'push' || inputs.push) && '1' || '0' }}
        run: |
          cd "${IMAGE_DIR}"
          bash build.sh

      # ---- cocoon image pull hard-fails without these ----
      - name: Validate published VM image
        if: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${PUBLISH_TAG}-${{ matrix.arch }}"
          docker run --rm --entrypoint /usr/local/libexec/cocoon/verify-vm-inner.sh "$REF"
          cid=$(docker create "$REF")
          docker export "$cid" | tar -tf - \
            | grep -E '(^|/)boot/(vmlinuz|initrd\.img)' | grep -v '\.old$' | head
          docker rm "$cid" >/dev/null
          echo "boot files OK in $REF"

  manifest:
    needs: bake
    if: ${{ github.event_name == 'push' || inputs.push }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A real OCI index — two arch tags alone defeat cocoon's WithPlatform auto-select.
      - name: Stitch multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${PUBLISH_TAG}" \
            "${IMAGE}:${PUBLISH_TAG}-amd64" \
            "${IMAGE}:${PUBLISH_TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${PUBLISH_TAG}"
